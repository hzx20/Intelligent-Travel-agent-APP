name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend offline pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 离线用例不调用模型。给个占位值，避免任何模块级 client 初始化在
      # 没有 .env 的 CI 里抛「缺少 ZHIPU_API_KEY」——那会让整批用例 import 就挂。
      ZHIPU_API_KEY: ci-placeholder
      TRAVEL_PROVIDER_BUDGET: "0"
      TRAVEL_SHARED_CACHE: "0"
      TRAVEL_SHARED_LIMITS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # test_m1/test_m2 会打真实模型，跑一次消耗额度还要几分钟，放到人工冒烟里做。
      # 只排除那两个真正依赖线上模型的用例，别再写 "not test_graph" 这种宽匹配——
      # 它会把 test_graph_contains_retrieve_before_generate 一起排除掉。
      #
      # 依赖本机材料（.release-candidates/、nginx 二进制、frontend/dist）的用例
      # 自己 skip，不在这里列——列在这里会让它们永远不被检查。
      - name: pytest
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short -rf \
            --ignore=tests/test_m1.py \
            --ignore=tests/test_m2.py \
            -k "not test_plan_stream_saves_history_when_logged_in and not test_graph_compiled_and_flows" \
            2>&1 | tee pytest.log
      # 失败时把尾部贴进 job summary：Actions 页面直接能看到哪条挂了，
      # 不用点进日志翻几千行。
      - name: failure summary
        if: failure()
        run: |
          {
            echo '### backend pytest failed'
            echo '```'
            tail -60 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend build:travel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 必须用 build:travel（base=/travel/、manifest 落点与线上一致）。
      # 默认的 npm run build 会产出根路径资源，发布后页面直接白屏。
      - run: npm run build:travel
