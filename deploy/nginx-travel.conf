# 合并进 /opt/continew/nginx.conf 的 http 块与 server 块
# 前提：同一台机器 80 端口已有另一个站点，本项目的静态文件在
#       /usr/share/nginx/html/travel（宿主机 /opt/continew/web/travel）

# ---- 放在 http 块内（与 upstream 同级）----
# 长接口路径需要足够的map桶；若http块已有此项，修改原值，不要重复添加。
map_hash_bucket_size 128;
limit_req_zone $binary_remote_addr zone=travel_plan:10m rate=6r/m;
# 只限制产生模型调用的 POST；普通读取、任务轮询和行程编辑不进入限流桶。
map "$request_method:$uri" $travel_ai_limit_key {
    default "";
    ~^POST:/travel/api/plan/jobs$ $binary_remote_addr;
    ~^POST:/travel/api/plan/jobs/create$ $binary_remote_addr;
    ~^POST:/travel/api/trips/[0-9]+/(ai-jobs|ai-proposals|guide-import/(preview|image-text))$ $binary_remote_addr;
    "POST:/travel/api/trips/guest-guide-preview" $binary_remote_addr;
    "POST:/travel/api/trips/guest-guide-image-text" $binary_remote_addr;
    "POST:/travel/api/trips/guest-ai-preview" $binary_remote_addr;
}
limit_req_zone $travel_ai_limit_key zone=travel_ai:10m rate=6r/m;
# Cancellation receipts write to the DB but never consume model quota.
map "$request_method:$uri" $travel_plan_control_key {
    default "";
    "POST:/travel/api/plan/jobs/create/cancel" $binary_remote_addr;
}
limit_req_zone $travel_plan_control_key zone=travel_plan_control:10m rate=30r/m;
map "$request_method:$uri" $travel_place_limit_key {
    default "";
    "POST:/travel/api/map/place-search" $binary_remote_addr;
}
limit_req_zone $travel_place_limit_key zone=travel_place:10m rate=20r/m;
map "$request_method:$uri" $travel_guest_route_limit_key {
    default "";
    "POST:/travel/api/map/guest-route" $binary_remote_addr;
}
limit_req_zone $travel_guest_route_limit_key zone=travel_guest_route:10m rate=30r/m;

# ---- 放在 server 块内（建议放在 location / 之前）----

# 规划接口是 SSE 长连接：必须关缓冲，否则前端收不到过程日志
location ^~ /travel/api/plan/stream {
    limit_req zone=travel_plan burst=2 nodelay;
    proxy_pass http://172.18.0.1:8000/api/plan/stream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # nginx 是公网入口时覆盖客户端自带的转发头，不能信任其提供的 IP 链。
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
}

# /travel/api/xxx -> 宿主机 8000 端口的 /api/xxx（末尾斜杠负责剥前缀）
location ^~ /travel/api/ {
    # 4 MiB 图片经 base64 和 JSON 编码后约 5.34 MiB；应用仍单独验证图片上限。
    client_max_body_size 6m;
    limit_req zone=travel_ai burst=2 nodelay;
    limit_req zone=travel_plan_control burst=5 nodelay;
    limit_req zone=travel_place burst=5 nodelay;
    # A trip can request up to 20 adjacent legs in one user-initiated batch.
    limit_req zone=travel_guest_route burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://172.18.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI 建议/攻略识别可能在格式校验失败后重试一次。
    proxy_read_timeout 180s;
    proxy_connect_timeout 10s;
}

# Vite带内容哈希的资源可长期缓存；缺失文件必须404，不能返回SPA首页。
location ^~ /travel/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 入口不长期缓存，发布后才能读取最新的资源映射。
location = /travel/index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store";
}

# 构建清单仅供部署预检，不作为公开页面。
location ^~ /travel/.vite/ {
    return 404;
}

# 发布锁和入口回退副本只供本机部署工具使用。
location ^~ /travel/.travel-deploy/ {
    return 404;
}

# ^~ 不能省：已有的正则静态资源规则会抢走 .js/.css，导致子路径 404
location ^~ /travel/ {
    try_files $uri $uri/ /travel/index.html;
}

location = /travel {
    return 301 /travel/;
}
