# 合并进 /opt/continew/nginx.conf 的 http 块与 server 块
# 前提：同一台机器 80 端口已有另一个站点，本项目的静态文件在
#       /usr/share/nginx/html/travel（宿主机 /opt/continew/web/travel）

# ---- 放在 http 块内（与 upstream 同级）----
limit_req_zone $binary_remote_addr zone=travel_plan:10m rate=6r/m;

# ---- 放在 server 块内（建议放在 location / 之前）----

# 规划接口是 SSE 长连接：必须关缓冲，否则前端收不到过程日志
location ^~ /travel/api/plan/stream {
    limit_req zone=travel_plan burst=2 nodelay;
    proxy_pass http://172.18.0.1:8000/api/plan/stream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
}

# /travel/api/xxx -> 宿主机 8000 端口的 /api/xxx（末尾斜杠负责剥前缀）
location ^~ /travel/api/ {
    proxy_pass http://172.18.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}

# ^~ 不能省：已有的正则静态资源规则会抢走 .js/.css，导致子路径 404
location ^~ /travel/ {
    try_files $uri $uri/ /travel/index.html;
}

location = /travel {
    return 301 /travel/;
}
